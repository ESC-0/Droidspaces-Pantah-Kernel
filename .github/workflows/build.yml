name: Build Pixel 7 kernel with Droidspaces support

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            build-essential bc bison flex patch pkg-config \
            tar xz-utils zip unzip cpio rsync kmod perl \
            libssl-dev libelf-dev pahole libncurses-dev \
            zlib1g-dev libyaml-dev lz4 zstd \
            device-tree-compiler adb fastboot

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download Pixel 7 kernel source
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            -j2

      - name: Download Droidspaces kernel patches
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            "$GITHUB_WORKSPACE/droidspaces"

      - name: Apply SYSVIPC kABI patch
        run: |
          set -euo pipefail

          KERNEL_MANIFEST_ROOT="$GITHUB_WORKSPACE/kernel"

          PATCH="$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"

          if [ ! -f "$PATCH" ]; then
            PATCH="$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch"
          fi

          if [ ! -f "$PATCH" ]; then
            echo "Required SYSVIPC kABI patch was not found."

            find \
              "$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12" \
              -type f \
              -print \
              | sort

            exit 1
          fi

          PATCH_TARGET="$(
            find "$KERNEL_MANIFEST_ROOT" \
              -type f \
              -path '*/include/linux/sched.h' \
              -print \
              | head -n 1
          )"

          if [ -z "$PATCH_TARGET" ]; then
            echo "Could not locate include/linux/sched.h."
            exit 1
          fi

          KERNEL_ROOT="${PATCH_TARGET%/include/linux/sched.h}"

          if [ ! -f "$KERNEL_ROOT/Makefile" ]; then
            echo "Invalid kernel root:"
            echo "$KERNEL_ROOT"
            exit 1
          fi

          cd "$KERNEL_ROOT"

          echo "Kernel root:"
          pwd

          echo "Kernel version:"
          make -s kernelversion

          if grep -q "ABI: use ABI padding for SYSVIPC" \
            include/linux/sched.h; then
            echo "SYSVIPC kABI patch is already applied."
          else
            echo "Checking patch..."
            patch --dry-run --batch --forward -p1 < "$PATCH"

            echo "Applying patch..."
            patch --batch --forward -p1 < "$PATCH"
          fi

      - name: Locate GKI configuration
        id: locate-config
        run: |
          set -euo pipefail

          CONFIG="$(
            find "$GITHUB_WORKSPACE/kernel" \
              -type f \
              -path '*/arch/arm64/configs/gki_defconfig' \
              -print \
              | head -n 1
          )"

          if [ -z "$CONFIG" ]; then
            echo "Could not find gki_defconfig."

            echo "Available arm64 defconfig files:"
            find "$GITHUB_WORKSPACE/kernel" \
              -type f \
              -path '*/arch/arm64/configs/*defconfig' \
              -print \
              | sort

            exit 1
          fi

          echo "CONFIG=$CONFIG" >> "$GITHUB_OUTPUT"

          echo "Using configuration:"
          echo "$CONFIG"

      - name: Enable recommended GKI configuration
        env:
          CONFIG: ${{ steps.locate-config.outputs.CONFIG }}
        run: |
          set -euo pipefail

          cp "$CONFIG" "$CONFIG.before-droidspaces"

          set_config() {
            local NAME="$1"

            if grep -q "^${NAME}=" "$CONFIG"; then
              sed -i "s/^${NAME}=.*/${NAME}=y/" "$CONFIG"
            elif grep -q "^# ${NAME} is not set$" "$CONFIG"; then
              sed -i "s/^# ${NAME} is not set$/${NAME}=y/" "$CONFIG"
            else
              printf '\n%s=y\n' "$NAME" >> "$CONFIG"
            fi
          }

          set_config CONFIG_SYSVIPC
          set_config CONFIG_POSIX_MQUEUE
          set_config CONFIG_IPC_NS
          set_config CONFIG_PID_NS
          set_config CONFIG_DEVTMPFS
          set_config CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          set_config CONFIG_USER_NS
          set_config CONFIG_NETFILTER_XT_TARGET_REJECT
          set_config CONFIG_NETFILTER_XT_TARGET_LOG
          set_config CONFIG_NETFILTER_XT_MATCH_RECENT
          set_config CONFIG_IP_SET
          set_config CONFIG_IP_SET_HASH_IP
          set_config CONFIG_IP_SET_HASH_NET
          set_config CONFIG_NETFILTER_XT_SET
          set_config CONFIG_TMPFS_POSIX_ACL
          set_config CONFIG_TMPFS_XATTR

          echo "Final configuration:"
          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_DEVTMPFS|CONFIG_NETFILTER_XT_MATCH_ADDRTYPE|CONFIG_USER_NS|CONFIG_NETFILTER_XT_TARGET_REJECT|CONFIG_NETFILTER_XT_TARGET_LOG|CONFIG_NETFILTER_XT_MATCH_RECENT|CONFIG_IP_SET|CONFIG_IP_SET_HASH_IP|CONFIG_IP_SET_HASH_NET|CONFIG_NETFILTER_XT_SET|CONFIG_TMPFS_POSIX_ACL|CONFIG_TMPFS_XATTR)=' \
            "$CONFIG" \
            | sort

      - name: Prepare clean Bazel output directory
        working-directory: kernel
        run: |
          set -euo pipefail

          rm -rf out/bazel
          mkdir -p out/bazel

      - name: Locate Bazel kernel distribution target
        working-directory: kernel
        run: |
          set -euo pipefail

          if [ ! -f common/BUILD.bazel ] \
            && [ ! -f common/BUILD ]; then
            echo "The common kernel build package was not found."

            find . \
              -maxdepth 3 \
              \( -name BUILD -o -name BUILD.bazel \) \
              -print \
              | sort

            exit 1
          fi

          echo "Available targets in //common:"
          tools/bazel query '//common:*' --output=label | sort

          TARGET="$(
            tools/bazel query '//common:*' --output=label \
              | grep -E '^//common:.*(_aarch64)?_dist$' \
              | head -n 1 || true
          )"

          if [ -z "$TARGET" ]; then
            TARGET="$(
              tools/bazel query '//common:*' --output=label \
                | grep -E '^//common:(kernel_aarch64|kernel_dist|kernel)$' \
                | head -n 1 || true
            )
          fi

          if [ -z "$TARGET" ]; then
            echo "No usable kernel build or distribution target was found in //common."
            echo "Targets exposed by the kernel source:"
            tools/bazel query '//common:*' --output=label | sort
            exit 1
          fi

          echo "Using target:"
          echo "$TARGET"

          echo "KERNEL_DIST_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Build Pixel 7 kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/kernel/dist"
          mkdir -p "$GITHUB_WORKSPACE/kernel/dist"

          tools/bazel run "$KERNEL_DIST_TARGET" \
            -- \
            --destdir="$GITHUB_WORKSPACE/kernel/dist"

      - name: Validate kernel output
        run: |
          set -euo pipefail

          DIST="$GITHUB_WORKSPACE/kernel/dist"

          if [ ! -d "$DIST" ]; then
            echo "Kernel distribution directory was not created:"
            echo "$DIST"
            exit 1
          fi

          echo "Kernel distribution contents:"
          find "$DIST" -type f -print | sort

          if ! find "$DIST" -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.lz4' \
              -o -name 'Image.gz' \
              -o -name '*.img' \
              -o -name '*.zip' \
            \) \
            -print \
            | grep -q .; then
            echo "No kernel image or flashable artifact was produced."
            exit 1
          fi

      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-droidspaces-kernel
          path: kernel/dist/
          if-no-files-found: error
          retention-days: 7
