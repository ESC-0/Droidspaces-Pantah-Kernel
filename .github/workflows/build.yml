name: Build Pixel 7 kernel with Droidspaces support

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            build-essential bc bison flex patch pkg-config \
            tar xz-utils zip unzip cpio rsync kmod perl \
            libssl-dev libelf-dev pahole libncurses-dev \
            zlib1g-dev libyaml-dev lz4 zstd \
            device-tree-compiler adb fastboot

      - name: Install repo
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -Lf \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download official Pixel 7 kernel source
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            -j2

          test -f aosp/Makefile
          test -f aosp/arch/arm64/configs/gki_defconfig

      - name: Download Droidspaces source
        run: |
          set -euo pipefail
          git clone --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            "$GITHUB_WORKSPACE/droidspaces"

      - name: Apply only the Pixel 7 GKI patch
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          PATCH="$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch"

          test -f "$PATCH"

          if git apply --reverse --check "$PATCH"; then
            echo "Patch is already applied."
          else
            git apply --check "$PATCH"
            git apply "$PATCH"
          fi

          git diff --check

      - name: Apply minimal Droidspaces configuration
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"
          cp "$CONFIG" "$CONFIG.before-droidspaces"

          cat > droidspaces.config <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          EOF

          while IFS= read -r setting; do
            option="${setting%%=*}"
            value="${setting#*=}"

            sed -i \
              -e "/^${option}=.*$/d" \
              -e "/^# ${option} is not set$/d" \
              "$CONFIG"

            printf '%s\n' "${option}=${value}" >> "$CONFIG"
          done < droidspaces.config

          git diff --check

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          rm -rf out bazel-bin bazel-out bazel-testlogs dist
          mkdir -p dist

          tools/bazel build \
            --config=local \
            --spawn_strategy=local \
            --strategy=KernelBuild=local \
            --disk_cache= \
            --repository_cache= \
            //common:kernel_aarch64

          tools/bazel build \
            --config=local \
            --spawn_strategy=local \
            --strategy=KernelBuild=local \
            --disk_cache= \
            --repository_cache= \
            //common:kernel_aarch64_images

      - name: Collect uncompressed Image
        working-directory: kernel
        run: |
          set -euo pipefail

          IMAGE="$(find bazel-bin out -type f -name Image -print -quit)"
          test -n "$IMAGE"

          cp "$IMAGE" dist/Image

          CONFIG="$(find out -name .config -type f -print -quit || true)"
          if [ -n "$CONFIG" ]; then
            cp "$CONFIG" dist/final.config
          fi

          cp aosp/arch/arm64/configs/gki_defconfig \
            dist/gki_defconfig

          sha256sum dist/Image
          stat -c '%n %s bytes' dist/Image

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-droidspaces-kernel
          path: kernel/dist/
          if-no-files-found: error
          retention-days: 7
