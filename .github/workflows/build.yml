name: Build Pixel 7 kernel with PID namespaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            build-essential bc bison flex patch pkg-config \
            tar xz-utils zip unzip cpio rsync kmod perl \
            libssl-dev libelf-dev pahole libncurses-dev \
            zlib1g-dev libyaml-dev lz4 zstd \
            device-tree-compiler adb fastboot

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download Google Pixel kernel source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            -j2

      - name: Enable CONFIG_PID_NS in gki_defconfig
        working-directory: kernel
        run: |
          set -eu

          CONFIG="common/arch/arm64/configs/gki_defconfig"

          if [ ! -f "$CONFIG" ]; then
            echo "Could not find $CONFIG"
            echo "Available gki_defconfig files:"
            find . -path '*/arch/arm64/configs/gki_defconfig' -print
            exit 1
          fi

          cp "$CONFIG" "$CONFIG.backup"

          if grep -q '^# CONFIG_PID_NS is not set$' "$CONFIG"; then
            sed -i \
              's/^# CONFIG_PID_NS is not set$/CONFIG_PID_NS=y/' \
              "$CONFIG"
          elif grep -q '^CONFIG_PID_NS=' "$CONFIG"; then
            sed -i \
              's/^CONFIG_PID_NS=.*/CONFIG_PID_NS=y/' \
              "$CONFIG"
          else
            printf '\nCONFIG_PID_NS=y\n' >> "$CONFIG"
          fi

          echo "Final setting:"
          grep '^CONFIG_PID_NS=' "$CONFIG"

      - name: Check kernel configuration
        working-directory: kernel
        run: |
          CONFIG="common/arch/arm64/configs/gki_defconfig"

          grep -E \
            '^(CONFIG_NAMESPACES|CONFIG_PID_NS)=' \
            "$CONFIG" || true

      - name: Find Pixel build target
        working-directory: kernel
        run: |
          set -eu

          echo "Searching for Pixel/pantah distribution targets..."

          tools/bazel query \
            'kind(".*_dist rule", //...)' \
            --output=label \
            | tee /tmp/all-dist-targets.txt

          TARGET="$(
            grep -Ei 'pantah|cheetah|gs101|pixel' \
              /tmp/all-dist-targets.txt \
              | head -n 1 || true
          )"

          if [ -z "$TARGET" ]; then
            echo "No Pixel distribution target was found."
            echo "All distribution targets were:"
            cat /tmp/all-dist-targets.txt
            exit 1
          fi

          echo "Using build target: $TARGET"
          echo "KERNEL_DIST_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Build Pixel kernel
        working-directory: kernel
        run: |
          echo "Building: $KERNEL_DIST_TARGET"
          tools/bazel run "$KERNEL_DIST_TARGET"

      - name: Collect kernel output
        if: success()
        working-directory: kernel
        run: |
          mkdir -p ../artifacts

          find bazel-bin -type f \
            \( \
              -name '*.img' \
              -o -name '*.zip' \
              -o -name 'Image' \
              -o -name 'Image.gz' \
              -o -name 'Image.lz4' \
            \) \
            -exec cp --parents {} ../artifacts/ \; || true

          echo "Produced files:"
          find ../artifacts -type f -ls

      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
