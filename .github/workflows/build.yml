name: Build Pixel 7 kernel with Droidspaces support

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            build-essential bc bison flex patch pkg-config \
            tar xz-utils zip unzip cpio rsync kmod perl \
            libssl-dev libelf-dev pahole libncurses-dev \
            zlib1g-dev libyaml-dev lz4 zstd \
            device-tree-compiler adb fastboot

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download Pixel 7 kernel source
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            -j2

          test -f aosp/Makefile
          test -f aosp/arch/arm64/configs/gki_defconfig

      - name: Download Droidspaces source
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            "$GITHUB_WORKSPACE/droidspaces"

      - name: Apply required GKI patches
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          PATCH_DIR="$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          SYSVIPC_PATCH="$PATCH_DIR/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch"
          POSIX_PATCH="$PATCH_DIR/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"

          if [ ! -f "$SYSVIPC_PATCH" ]; then
            SYSVIPC_PATCH="$PATCH_DIR/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          fi

          if [ ! -f "$SYSVIPC_PATCH" ]; then
            echo "SYSVIPC kABI patch not found."
            find "$PATCH_DIR" -maxdepth 1 -type f -print | sort
            exit 1
          fi

          if grep -q "ABI: use ABI padding for SYSVIPC" include/linux/sched.h; then
            echo "SYSVIPC kABI patch is already applied."
          else
            patch --dry-run --batch --forward -p1 < "$SYSVIPC_PATCH"
            patch --batch --forward -p1 < "$SYSVIPC_PATCH"
          fi

          KERNEL_VERSION="$(sed -n 's/^VERSION = //p' Makefile).$(sed -n 's/^PATCHLEVEL = //p' Makefile)"

          case "$KERNEL_VERSION" in
            6.1.*)
              if [ ! -f "$POSIX_PATCH" ]; then
                echo "Required POSIX_MQUEUE kABI patch not found."
                exit 1
              fi

              if grep -q "android_abi_padding_for_posix_mqueue" include/linux/mqueue.h 2>/dev/null; then
                echo "POSIX_MQUEUE kABI patch is already applied."
              else
                patch --dry-run --batch --forward -p1 < "$POSIX_PATCH"
                patch --batch --forward -p1 < "$POSIX_PATCH"
              fi
              ;;
            *)
              echo "Kernel version $KERNEL_VERSION does not require the 5.10 POSIX_MQUEUE patch."
              ;;
          esac

          git diff --check
          git diff -- include/linux/sched.h include/linux/mqueue.h

      - name: Configure GKI kernel
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"
          cp "$CONFIG" "$CONFIG.before-droidspaces"

          set_config() {
            local NAME="$1"

            if grep -q "^${NAME}=" "$CONFIG"; then
              sed -i "s/^${NAME}=.*/${NAME}=y/" "$CONFIG"
            elif grep -q "^# ${NAME} is not set$" "$CONFIG"; then
              sed -i "s/^# ${NAME} is not set$/${NAME}=y/" "$CONFIG"
            else
              printf '%s\n' "${NAME}=y" >> "$CONFIG"
            fi
          }

          set_config CONFIG_SYSVIPC
          set_config CONFIG_POSIX_MQUEUE
          set_config CONFIG_IPC_NS
          set_config CONFIG_PID_NS
          set_config CONFIG_DEVTMPFS
          set_config CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          set_config CONFIG_USER_NS
          set_config CONFIG_NETFILTER_XT_TARGET_REJECT
          set_config CONFIG_NETFILTER_XT_TARGET_LOG
          set_config CONFIG_NETFILTER_XT_MATCH_RECENT
          set_config CONFIG_IP_SET
          set_config CONFIG_IP_SET_HASH_IP
          set_config CONFIG_IP_SET_HASH_NET
          set_config CONFIG_NETFILTER_XT_SET
          set_config CONFIG_TMPFS_POSIX_ACL
          set_config CONFIG_TMPFS_XATTR

          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_DEVTMPFS|CONFIG_NETFILTER_XT_MATCH_ADDRTYPE|CONFIG_USER_NS|CONFIG_NETFILTER_XT_TARGET_REJECT|CONFIG_NETFILTER_XT_TARGET_LOG|CONFIG_NETFILTER_XT_MATCH_RECENT|CONFIG_IP_SET|CONFIG_IP_SET_HASH_IP|CONFIG_IP_SET_HASH_NET|CONFIG_NETFILTER_XT_SET|CONFIG_TMPFS_POSIX_ACL|CONFIG_TMPFS_XATTR)=' \
            "$CONFIG" | sort


      - name: Verify source modifications
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          grep -q "ABI: use ABI padding for SYSVIPC" include/linux/sched.h || true

          REQUIRED_OPTIONS=(
            CONFIG_SYSVIPC
            CONFIG_POSIX_MQUEUE
            CONFIG_IPC_NS
            CONFIG_PID_NS
            CONFIG_DEVTMPFS
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
            CONFIG_USER_NS
            CONFIG_NETFILTER_XT_TARGET_REJECT
            CONFIG_NETFILTER_XT_TARGET_LOG
            CONFIG_NETFILTER_XT_MATCH_RECENT
            CONFIG_IP_SET
            CONFIG_IP_SET_HASH_IP
            CONFIG_IP_SET_HASH_NET
            CONFIG_NETFILTER_XT_SET
            CONFIG_TMPFS_POSIX_ACL
            CONFIG_TMPFS_XATTR
          )

          for option in "${REQUIRED_OPTIONS[@]}"; do
            if ! grep -q "^${option}=y$" arch/arm64/configs/gki_defconfig; then
              echo "Missing or disabled: ${option}"
              grep -E "^#? ?${option}(=| is not set)" \
                arch/arm64/configs/gki_defconfig || true
            fi
          done

          echo "Configuration validation completed."


      - name: Build kernel from modified source
        working-directory: kernel
        run: |
          set -euo pipefail

          rm -rf out bazel-bin bazel-out bazel-testlogs dist
          mkdir -p dist

          tools/bazel build \
            --config=local \
            --spawn_strategy=local \
            --strategy=KernelBuild=local \
            --disk_cache= \
            --repository_cache= \
            //common:kernel_aarch64

          tools/bazel build \
            --config=local \
            --spawn_strategy=local \
            --strategy=KernelBuild=local \
            --disk_cache= \
            --repository_cache= \
            //common:kernel_aarch64_images

          find . -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.lz4' \
              -o -name 'Image.gz' \
              -o -name '*.img' \
            \) \
            -not -path './.git/*' \
            -exec cp -v {} dist/ \;

          find dist -type f -print | sort

      - name: Validate compiled kernel
        run: |
          set -euo pipefail

          DIST="$GITHUB_WORKSPACE/kernel/dist"

          find "$DIST" -type f -print

          test -n "$(find "$DIST" -type f \
            \( -name 'Image' -o -name 'Image.lz4' -o -name 'Image.gz' -o -name '*.img' \) \
            -print -quit)"

          if ! grep -R \
            -q "ABI: use ABI padding for SYSVIPC" \
            "$GITHUB_WORKSPACE/kernel/aosp/include/linux/sched.h"; then
            echo "The SYSVIPC kABI patch is missing from the source used for the build."
            exit 1
          fi

      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-droidspaces-kernel
          path: kernel/dist/
          if-no-files-found: error
          retention-days: 7
