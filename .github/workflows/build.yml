name: Build Pixel 7 pantah kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            rsync unzip zip cpio pahole

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download Pixel kernel source
        run: |
          mkdir "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16 \
            --depth=1

          repo sync -c --force-sync --no-tags -j2

      - name: Enable PID namespaces
        working-directory: kernel
        run: |
          set -eu

          echo "Searching configuration files..."
          grep -RIl \
            --include='*defconfig' \
            --include='*.config' \
            'CONFIG_PID_NS\|PID_NS' . || true

          files="$(grep -RIl \
            --include='*defconfig' \
            --include='*.config' \
            'CONFIG_PID_NS\|PID_NS' . || true)"

          if [ -z "$files" ]; then
            echo "CONFIG_PID_NS was not found in a defconfig/config file."
            echo "The configuration is probably generated by a Kleaf target."
            exit 1
          fi

          for file in $files; do
            echo "Modifying: $file"

            sed -i \
              -e 's/^# CONFIG_PID_NS is not set$/CONFIG_PID_NS=y/' \
              -e 's/^CONFIG_PID_NS=.*/CONFIG_PID_NS=y/' \
              "$file"

            if ! grep -q '^CONFIG_PID_NS=y$' "$file"; then
              printf '\nCONFIG_PID_NS=y\n' >> "$file"
            fi
          done

          echo "Result:"
          grep -RIn \
            --include='*defconfig' \
            --include='*.config' \
            '^CONFIG_PID_NS=y$' . || true

      - name: Build kernel
        working-directory: kernel
        run: |
          tools/bazel run //device/google/pantah:pantah_dist

      - name: Find build output
        if: success()
        working-directory: kernel
        run: |
          mkdir -p ../artifacts
          find bazel-bin -type f \
            \( -name '*.img' -o -name '*.zip' -o -name 'Image*' \) \
            -exec cp --parents {} ../artifacts/ \; || true

          find ../artifacts -type f -ls

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
