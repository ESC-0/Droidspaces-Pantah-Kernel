name: Build Pixel 7 kernel (sultan-17; per-pattern safer builds with llvm fix)

on:
  workflow_dispatch:

env:
  EXTRA_CONFIG_PATH: "kernel/droidspaces-fragment.config"
  KERNEL_FORK_REPO: "https://github.com/ESC-0/SULTAN17.git"
  KERNEL_FORK_BRANCH: "sultan-17"

jobs:
  build-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (includes llvm & lld)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex pkg-config \
            git curl tar xz-utils zip unzip cpio rsync kmod perl python3 python-is-python3 \
            libssl-dev libelf-dev pahole libncurses-dev zlib1g-dev libyaml-dev \
            lz4 zstd device-tree-compiler wget openjdk-11-jdk lld llvm

      - name: Create 16G swapfile (improves reliability for heavy host tools)
        run: |
          set -euo pipefail
          SWAPFILE=/swapfile
          if [ ! -f "${SWAPFILE}" ]; then
            sudo fallocate -l 16G "${SWAPFILE}" || sudo dd if=/dev/zero of="${SWAPFILE}" bs=1M count=16384
            sudo chmod 600 "${SWAPFILE}"
            sudo mkswap "${SWAPFILE}"
            sudo swapon "${SWAPFILE}"
          fi
          sudo swapon --show || true

      - name: Install repo helper and ensure $HOME/bin on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -Lf https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clone Droidspaces (patches)
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/droidspaces" || true
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$GITHUB_WORKSPACE/droidspaces"
          mkdir -p /tmp/patch-results

      - name: Export absolute PATCH_BASE and verify
        run: |
          set -euo pipefail
          PATCH_BASE="${GITHUB_WORKSPACE}/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          echo "PATCH_BASE=${PATCH_BASE}" >> "$GITHUB_ENV"
          ls -la "${PATCH_BASE}" > /tmp/patch_base_list.txt || true
          cat /tmp/patch_base_list.txt || true
          ls -la "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" > /tmp/fragment_list.txt 2>/dev/null || true
          cat /tmp/fragment_list.txt || true

      - name: Clone fork into kernel/aosp
        run: |
          set -euo pipefail
          rm -rf kernel || true
          mkdir -p kernel
          git clone --depth=1 --branch "${KERNEL_FORK_BRANCH}" "${KERNEL_FORK_REPO}" kernel/aosp

      - name: Prepare aosp-base
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf aosp-base || true
          cp -a aosp aosp-base

      - name: Pattern 678 - apply patch and build
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          short=678
          label=6_7_8
          LOGDIR="/tmp/patch-results/${short}"
          rm -rf "${LOGDIR}" || true
          mkdir -p "${LOGDIR}"
          workdir="aosp-patch-${label}"
          rm -rf "${workdir}" || true
          cp -a aosp-base "${workdir}"

          PATCH="${PATCH_BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_${label}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
          else
            pushd "${workdir}" >/dev/null
            if git apply --reverse --check "$PATCH" 2>/dev/null; then
              echo "already-applied" > "${LOGDIR}/apply-status-${short}.txt"
            elif git apply --check "$PATCH" 2>/dev/null && git apply "$PATCH"; then
              echo "applied-clean" > "${LOGDIR}/apply-status-${short}.txt"
              git diff --name-only > "${LOGDIR}/applied-files-${short}.txt" || true
            else
              echo "apply-failed" > "${LOGDIR}/apply-status-${short}.txt"
              git apply --reject --whitespace=fix "$PATCH" 2> "${LOGDIR}/apply-stderr-${short}.txt" || true
              find . -name '*.rej' -print -exec cp --parents {} "${LOGDIR}/" \; || true
            fi
            cp -v "$PATCH" "${LOGDIR}/" 2>/dev/null || true
            popd >/dev/null
          fi

          if [ -f "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" ]; then
            mkdir -p "${workdir}/arch/arm64/configs"
            cp "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" "${workdir}/arch/arm64/configs/extra-frag.config"
            echo "copied fragment" > "${LOGDIR}/extra_config_injected-${short}.txt"
          else
            mkdir -p "${workdir}/arch/arm64/configs"
            printf '%s\n' '# auto-generated fallback fragment' 'CONFIG_SHRINKER_RWSEM=y' > "${workdir}/arch/arm64/configs/extra-frag.config"
            echo "created fallback fragment (CONFIG_SHRINKER_RWSEM=y)" > "${LOGDIR}/extra_config_injected-${short}.txt"
          fi

          # ensure clang toolchain present
          CLANG_DIR="${HOME}/toolchains/clang-r510928"
          if [ ! -d "${CLANG_DIR}" ]; then
            mkdir -p "${HOME}/toolchains"
            curl -sL https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r510928.tar.gz | tar -xzf - -C "${HOME}/toolchains/"
          fi

          # prefer system llvm-nm (installed via apt) to avoid toolchain llvm-nm OOM
          export PATH="/usr/bin:${CLANG_DIR}/bin:${HOME}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CLANG_DIR}/lib:${CLANG_DIR}/lib64:${LD_LIBRARY_PATH:-}"
          mkdir -p "${HOME}/bin"
          if ! command -v llvm-nm >/dev/null 2>&1 && command -v nm >/dev/null 2>&1; then
            ln -sf "$(command -v nm)" "${HOME}/bin/llvm-nm" || true
          fi

          pushd "${workdir}" >/dev/null
          echo "Starting config and build for ${label} -> ${short}" > "${LOGDIR}/build-run-${short}.txt"

          export MAKEFLAGS=-j1
          DEFCONFIG=gki_defconfig
          BUILD_OPTS="ARCH=arm64 O=${PWD}/out LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++"

          make ${BUILD_OPTS} "${DEFCONFIG}" EXTRA_CONFIGS="extra-frag.config" 2>&1 | tee "${LOGDIR}/defconfig-output-${short}.log" || true

          if ! grep -q '^CONFIG_SHRINKER_RWSEM=y' out/.config 2>/dev/null; then
            echo 'CONFIG_SHRINKER_RWSEM=y' >> out/.config || true
            make ${BUILD_OPTS} olddefconfig 2>&1 | tee -a "${LOGDIR}/defconfig-output-${short}.log" || true
            echo "forced CONFIG_SHRINKER_RWSEM=y" > "${LOGDIR}/forced-config-${short}.txt" || true
          fi

          make ${BUILD_OPTS} Image 2>&1 | tee "${LOGDIR}/build-output-${short}.log" || true

          tail -n 2000 "${LOGDIR}/build-output-${short}.log" > "${LOGDIR}/build-output-tail-${short}.txt" || true
          ls -la > "${LOGDIR}/workdir-listing-${short}.txt" || true

          if [ -f out/arch/arm64/boot/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp out/arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
          elif [ -f arch/arm64/boot/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
          elif [ -f build/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp build/Image ../../kernel/dist/${short}/Image || true
          fi

          find out -name .config -type f -exec cp -v {} "${LOGDIR}/final.config" \; 2>/dev/null || true
          popd >/dev/null

          tar -czf "/tmp/patch-results/${short}-logs.tar.gz" -C "/tmp/patch-results/${short}" . || true

      - name: Upload per-road-logs-678
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-road-logs-678
          path: /tmp/patch-results/678
          if-no-files-found: warn

      - name: Upload image-678
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-kernel-678
          path: kernel/dist/678
          if-no-files-found: warn

      - name: Pattern 345 - apply patch and build
        working-directory: kernel
        continue-on-error: true
