name: Build Pixel 7 kernel (forked Sultan17 baseline)

on:
  workflow_dispatch:

env:
  PATCH_BASE: "$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
  EXTRA_CONFIG_PATH: "kernel/droidspaces-fragment.config"
  KERNEL_FORK_REPO: "https://github.com/ESC-0/SULTAN17.git"
  KERNEL_FORK_BRANCH: "sultan-17"

jobs:
  build-patterns:
    name: Build against your fork (kernel/)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (DEB list)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex pkg-config \
            git curl tar xz-utils zip unzip cpio rsync kmod perl python3 python-is-python3 \
            libssl-dev libelf-dev pahole libncurses-dev zlib1g-dev libyaml-dev \
            lz4 zstd device-tree-compiler wget openjdk-11-jdk

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -Lf https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clone Droidspaces (patches)
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/droidspaces" || true
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$GITHUB_WORKSPACE/droidspaces"
          mkdir -p /tmp/patch-results
          if [ -d "${PATCH_BASE}" ]; then
            ls -la "${PATCH_BASE}" > /tmp/patch-results/patch_base_list.txt || true
          else
            echo "PATCH_BASE missing: ${PATCH_BASE}" > /tmp/patch-results/patch_base_list.txt
          fi

      - name: Clone your fork as kernel source
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/kernel" || true
          git clone --depth=1 --branch "${KERNEL_FORK_BRANCH}" "${KERNEL_FORK_REPO}" "$GITHUB_WORKSPACE/kernel"
          # quick sanity
          if [ ! -f "$GITHUB_WORKSPACE/kernel/Makefile" ] || [ ! -d "$GITHUB_WORKSPACE/kernel/arch/arm64" ]; then
            echo "Warning: kernel tree in kernel/ may not be a proper kernel repo" > /tmp/patch-results/kernel_tree_check.txt
            ls -la "$GITHUB_WORKSPACE/kernel" >> /tmp/patch-results/kernel_tree_check.txt || true
          fi

      - name: Prepare aosp-base and get official build_6.1.sh
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf aosp-base || true
          cp -a . aosp-base
          curl -fsSL -o build_6.1.sh \
            https://raw.githubusercontent.com/ravindu644/Android-Kernel-Tutorials/f0e815e5ee1197e7d25142c74060dfa4e10d38da/build_scripts/build_6.1.sh
          chmod +x build_6.1.sh

      - name: Run 3 pattern builds (your fork)
        working-directory: kernel
        run: |
          set -euo pipefail
          set -x
          declare -A MAP=( ["6_7_8"]="678" ["3_4_5"]="345" ["1_2_3"]="123" )
          labels=( "6_7_8" "3_4_5" "1_2_3" )
          for label in "${labels[@]}"; do
            short="${MAP[$label]}"
            LOGDIR="/tmp/patch-results/${short}"
            rm -rf "${LOGDIR}" || true
            mkdir -p "${LOGDIR}"
            workdir="aosp-patch-${label}"
            rm -rf "${workdir}" || true
            cp -a aosp-base "${workdir}"

            PATCH="${PATCH_BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_${label}.patch"
            if [ ! -f "$PATCH" ]; then
              echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
            else
              pushd "${workdir}" >/dev/null || exit 1
              if git apply --reverse --check "$PATCH" 2>/dev/null; then
                echo "already-applied" > "${LOGDIR}/apply-status-${short}.txt"
              elif git apply --check "$PATCH" 2>/dev/null && git apply "$PATCH"; then
                echo "applied-clean" > "${LOGDIR}/apply-status-${short}.txt"
                git diff --name-only > "${LOGDIR}/applied-files-${short}.txt" || true
              else
                echo "apply-failed" > "${LOGDIR}/apply-status-${short}.txt"
                git apply --reject --whitespace=fix "$PATCH" 2> "${LOGDIR}/apply-stderr-${short}.txt" || true
                find . -name '*.rej' -print -exec cp --parents {} "${LOGDIR}/" \; || true
              fi
              cp -v "$PATCH" "${LOGDIR}/" 2>/dev/null || true
              popd >/dev/null
            fi

            cp build_6.1.sh "${workdir}/build_6.1.sh"
            chmod +x "${workdir}/build_6.1.sh"
            sed -i 's/^[[:space:]]*install_deps[[:space:]]*$/# install_deps disabled in CI: packages preinstalled/' "${workdir}/build_6.1.sh" || true
            sed -i 's/^MENUCONFIG=.*/MENUCONFIG=0/' "${workdir}/build_6.1.sh" || true
            sed -n '1,140p' "${workdir}/build_6.1.sh" > "${LOGDIR}/build_6.1-modified-head-${short}.txt" || true

            if [ -f "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" ]; then
              mkdir -p "${workdir}/arch/arm64/configs"
              cp "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" "${workdir}/arch/arm64/configs/extra-frag.config"
              sed -i 's/^EXTRA_CONFIGS=.*/EXTRA_CONFIGS=(\"extra-frag.config\")/' "${workdir}/build_6.1.sh" || true
              echo "copied fragment to arch/arm64/configs/extra-frag.config" > "${LOGDIR}/extra_config_injected-${short}.txt"
            else
              echo "extra_config_not_found:${EXTRA_CONFIG_PATH}" > "${LOGDIR}/extra_config_injected-${short}.txt"
            fi

            pushd "${workdir}" >/dev/null || exit 1
            echo "Starting build for pattern ${label} -> ${short}" > "${LOGDIR}/build-run-${short}.txt"
            if ./build_6.1.sh 2>&1 | tee "${LOGDIR}/build-output-${short}.log"; then
              echo "build-succeeded" > "${LOGDIR}/build-status-${short}.txt"
            else
              echo "build-failed" > "${LOGDIR}/build-status-${short}.txt"
            fi
            ls -la > "${LOGDIR}/workdir-listing-${short}.txt" || true

            if [ -f out/arch/arm64/boot/Image ]; then
              mkdir -p ../../kernel/dist/${short}
              cp out/arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
            elif [ -f arch/arm64/boot/Image ]; then
              mkdir -p ../../kernel/dist/${short}
              cp arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
            elif [ -f build/Image ]; then
              mkdir -p ../../kernel/dist/${short}
              cp build/Image ../../kernel/dist/${short}/Image || true
            fi

            find out -name .config -type f -exec cp -v {} "${LOGDIR}/final.config" \; 2>/dev/null || true
            popd >/dev/null

            tar -czf "/tmp/patch-results/${short}-logs.tar.gz" -C "/tmp/patch-results/${short}" . || true
          done

      - name: Upload per-road logs (123 / 345 / 678)
        uses: actions/upload-artifact@v4
        with:
          name: per-road-logs
          path: |
            /tmp/patch-results/123-logs.tar.gz
            /tmp/patch-results/345-logs.tar.gz
            /tmp/patch-results/678-logs.tar.gz
          if-no-files-found: warn

      - name: Upload Images (your fork)
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-kernel-fork
          path: kernel/dist
          if-no-files-found: warn
          retention-days: 7

  build-sultan:
    name: Build against same fork (kernel-sultan/)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: build-patterns
    steps:
      - name: Checkout repository (for fragment & workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (DEB list)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex pkg-config \
            git curl tar xz-utils zip unzip cpio rsync kmod perl python3 python-is-python3 \
            libssl-dev libelf-dev pahole libncurses-dev zlib1g-dev libyaml-dev \
            lz4 zstd device-tree-compiler wget openjdk-11-jdk

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -Lf https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clone Droidspaces (patches)
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/droidspaces" || true
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$GITHUB_WORKSPACE/droidspaces"
          mkdir -p /tmp/patch-results-sultan
          if [ -d "${PATCH_BASE}" ]; then
            ls -la "${PATCH_BASE}" > /tmp/patch-results-sultan/patch_base_list.txt || true
          else
            echo "PATCH_BASE missing: ${PATCH_BASE}" > /tmp/patch-results-sultan/patch_base_list.txt
          fi

      - name: Clone your fork for sultan job
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/kernel-sultan" || true
          git clone --depth=1 --branch "${KERNEL_FORK_BRANCH}" "${KERNEL_FORK_REPO}" "$GITHUB_WORKSPACE/kernel-sultan"
          if [ ! -f kernel-sultan/Makefile ]; then
            echo "Warning: kernel-sultan may not be a kernel tree" > /tmp/patch-results-sultan/kernel_tree_check.txt
            ls -la kernel-sultan >> /tmp/patch-results-sultan/kernel_tree_check.txt || true
          fi

      - name: Prepare sultan base and get official build_6.1.sh
        working-directory: kernel-sultan
        run: |
          set -euo pipefail
          rm -rf aosp-base || true
          cp -a . aosp-base
          curl -fsSL -o build_6.1.sh \
            https://raw.githubusercontent.com/ravindu644/Android-Kernel-Tutorials/f0e815e5ee1197e7d25142c74060dfa4e10d38da/build_scripts/build_6.1.sh
          chmod +x build_6.1.sh

      - name: Run 3 pattern builds (forked kernel-sultan)
        working-directory: kernel-sultan
        run: |
          set -euo pipefail
          set -x
          declare -A MAP=( ["6_7_8"]="678" ["3_4_5"]="345" ["1_2_3"]="123" )
          labels=( "6_7_8" "3_4_5" "1_2_3" )
          for label in "${labels[@]}"; do
            short="${MAP[$label]}"
            LOGDIR="/tmp/patch-results-sultan/${short}"
            rm -rf "${LOGDIR}" || true
            mkdir -p "${LOGDIR}"
            workdir="aosp-patch-${label}"
            rm -rf "${workdir}" || true
            cp -a aosp-base "${workdir}"

            PATCH="${PATCH_BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_${label}.patch"
            if [ ! -f "$PATCH" ]; then
              echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
            else
              pushd "${workdir}" >/dev/null || exit 1
              if git apply --reverse --check "$PATCH" 2>/dev/null; then
                echo "already-applied" > "${LOGDIR}/apply-status-${short}.txt"
              elif git apply --check "$PATCH" 2>/dev/null && git apply "$PATCH"; then
                echo "applied-clean" > "${LOGDIR}/apply-status-${short}.txt"
                git diff --name-only > "${LOGDIR}/applied-files-${short}.txt" || true
              else
                echo "apply-failed" > "${LOGDIR}/apply-status-${short}.txt"
                git apply --reject --whitespace=fix "$PATCH" 2> "${LOGDIR}/apply-stderr-${short}.txt" || true
                find . -name '*.rej' -print -exec cp --parents {} "${LOGDIR}/" \; || true
              fi
              cp -v "$PATCH" "${LOGDIR}/" 2>/dev/null || true
              popd >/dev/null
            fi

            cp build_6.1.sh "${workdir}/build_6.1.sh"
            chmod +x "${workdir}/build_6.1.sh"
            sed -i 's/^[[:space:]]*install_deps[[:space:]]*$/# install_deps disabled in CI: packages preinstalled/' "${workdir}/build_6.1.sh" || true
            sed -i 's/^MENUCONFIG=.*/MENUCONFIG=0/' "${workdir}/build_6.1.sh" || true
            sed -n '1,140p' "${workdir}/build_6.1.sh" > "${LOGDIR}/build_6.1-modified-head-${short}.txt" || true

            if [ -f "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" ]; then
              mkdir -p "${workdir}/arch/arm64/configs"
              cp "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" "${workdir}/arch/arm64/configs/extra-frag.config"
              sed -i 's/^EXTRA_CONFIGS=.*/EXTRA_CONFIGS=(\"extra-frag.config\")/' "${workdir}/build_6.1.sh" || true
              echo "copied fragment to arch/arm64/configs/extra-frag.config" > "${LOGDIR}/extra_config_injected-${short}.txt"
            else
              echo "extra_config_not_found:${EXTRA_CONFIG_PATH}" > "${LOGDIR}/extra_config_injected-${short}.txt"
            fi

            pushd "${workdir}" >/dev/null || exit 1
            echo "Starting build for pattern ${label} -> ${short}" > "${LOGDIR}/build-run-${short}.txt"
            if ./build_6.1.sh 2>&1 | tee "${LOGDIR}/build-output-${short}.log"; then
              echo "build-succeeded" > "${LOGDIR}/build-status-${short}.txt"
            else
              echo "build-failed" > "${LOGDIR}/build-status-${short}.txt"
            fi
            ls -la > "${LOGDIR}/workdir-listing-${short}.txt" || true

            if [ -f out/arch/arm64/boot/Image ]; then
              mkdir -p ../../kernel-sultan/dist/${short}
              cp out/arch/arm64/boot/Image ../../kernel-sultan/dist/${short}/Image || true
            elif [ -f arch/arm64/boot/Image ]; then
              mkdir -p ../../kernel-sultan/dist/${short}
              cp arch/arm64/boot/Image ../../kernel-sultan/dist/${short}/Image || true
            elif [ -f build/Image ]; then
              mkdir -p ../../kernel-sultan/dist/${short}
              cp build/Image ../../kernel-sultan/dist/${short}/Image || true
            fi

            find out -name .config -type f -exec cp -v {} "${LOGDIR}/final.config" \; 2>/dev/null || true
            popd >/dev/null

            tar -czf "/tmp/patch-results-sultan/${short}-logs.tar.gz" -C "/tmp/patch-results-sultan/${short}" . || true
          done

      - name: Upload per-road logs (sultan)
        uses: actions/upload-artifact@v4
        with:
          name: per-road-logs-sultan
          path: |
            /tmp/patch-results-sultan/123-logs.tar.gz
            /tmp/patch-results-sultan/345-logs.tar.gz
            /tmp/patch-results-sultan/678-logs.tar.gz
          if-no-files-found: warn

      - name: Upload Images (sultan)
        uses: actions/upload-artifact@v4
