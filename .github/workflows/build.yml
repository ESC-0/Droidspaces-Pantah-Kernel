          if [ ! -f "$PATCH" ]; then
            echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
          else
            pushd "${workdir}" >/dev/null
            if git apply --reverse --check "$PATCH" 2>/dev/null; then
