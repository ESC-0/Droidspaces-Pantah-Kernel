name: Build Pixel 7 kernel (forked Sultan17 minimal change)

on:
  workflow_dispatch:name: Build Pixel 7 kernel (sultan-17; per-pattern upload)

on:
  workflow_dispatch:

env:
  PATCH_BASE: "$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
  EXTRA_CONFIG_PATH: "kernel/droidspaces-fragment.config"
  KERNEL_FORK_REPO: "https://github.com/ESC-0/SULTAN17.git"
  KERNEL_FORK_BRANCH: "sultan-17"

jobs:
  build-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo (workflow & fragment)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (DEB list)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex pkg-config \
            git curl tar xz-utils zip unzip cpio rsync kmod perl python3 python-is-python3 \
            libssl-dev libelf-dev pahole libncurses-dev zlib1g-dev libyaml-dev \
            lz4 zstd device-tree-compiler wget openjdk-11-jdk

      - name: Clone Droidspaces (patches)
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/droidspaces" || true
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$GITHUB_WORKSPACE/droidspaces"
          mkdir -p /tmp/patch-results

      - name: Clone your fork into kernel/aosp (minimal change)
        run: |
          set -euo pipefail
          rm -rf kernel || true
          mkdir -p kernel
          git clone --depth=1 --branch "${KERNEL_FORK_BRANCH}" "${KERNEL_FORK_REPO}" kernel/aosp

      - name: Prepare aosp-base and get official build_6.1.sh
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf aosp-base || true
          cp -a aosp aosp-base
          curl -fsSL -o build_6.1.sh \
            https://raw.githubusercontent.com/ravindu644/Android-Kernel-Tutorials/f0e815e5ee1197e7d25142c74060dfa4e10d38da/build_scripts/build_6.1.sh
          chmod +x build_6.1.sh

      ####################################################################
      # Pattern 678: run, capture logs, upload logs+image before next
      ####################################################################
      - name: Pattern 678 — apply patch & run build_6.1.sh
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          short="678"
          label="6_7_8"
          LOGDIR="/tmp/patch-results/${short}"
          rm -rf "${LOGDIR}" || true
          mkdir -p "${LOGDIR}"
          workdir="aosp-patch-${label}"
          rm -rf "${workdir}" || true
          cp -a aosp-base "${workdir}"

          PATCH="${PATCH_BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_${label}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
          else
            pushd "${workdir}" >/dev/null || exit 1
            if git apply --reverse --check "$PATCH" 2>/dev/null; then
              echo "already-applied" > "${LOGDIR}/apply-status-${short}.txt"
            elif git apply --check "$PATCH" 2>/dev/null && git apply "$PATCH"; then
              echo "applied-clean" > "${LOGDIR}/apply-status-${short}.txt"
              git diff --name-only > "${LOGDIR}/applied-files-${short}.txt" || true
            else
              echo "apply-failed" > "${LOGDIR}/apply-status-${short}.txt"
              git apply --reject --whitespace=fix "$PATCH" 2> "${LOGDIR}/apply-stderr-${short}.txt" || true
              find . -name '*.rej' -print -exec cp --parents {} "${LOGDIR}/" \; || true
            fi
            cp -v "$PATCH" "${LOGDIR}/" 2>/dev/null || true
            popd >/dev/null
          fi

          cp build_6.1.sh "${workdir}/build_6.1.sh"
          chmod +x "${workdir}/build_6.1.sh"
          sed -i 's/^[[:space:]]*install_deps[[:space:]]*$/# install_deps disabled in CI: packages preinstalled/' "${workdir}/build_6.1.sh" || true
          sed -i 's/^MENUCONFIG=.*/MENUCONFIG=0/' "${workdir}/build_6.1.sh" || true
          sed -n '1,140p' "${workdir}/build_6.1.sh" > "${LOGDIR}/build_6.1-modified-head-${short}.txt" || true

          if [ -f "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" ]; then
            mkdir -p "${workdir}/arch/arm64/configs"
            cp "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" "${workdir}/arch/arm64/configs/extra-frag.config"
            sed -i 's/^EXTRA_CONFIGS=.*/EXTRA_CONFIGS=(\"extra-frag.config\")/' "${workdir}/build_6.1.sh" || true
            echo "copied fragment to arch/arm64/configs/extra-frag.config" > "${LOGDIR}/extra_config_injected-${short}.txt"
          else
            echo "extra_config_not_found:${EXTRA_CONFIG_PATH}" > "${LOGDIR}/extra_config_injected-${short}.txt"
          fi

          pushd "${workdir}" >/dev/null || exit 1
          echo "Starting build for pattern ${label} -> ${short}" > "${LOGDIR}/build-run-${short}.txt"
          if ./build_6.1.sh 2>&1 | tee "${LOGDIR}/build-output-${short}.log"; then
            echo "build-succeeded" > "${LOGDIR}/build-status-${short}.txt"
          else
            echo "build-failed" > "${LOGDIR}/build-status-${short}.txt"
          fi
          ls -la > "${LOGDIR}/workdir-listing-${short}.txt" || true

          if [ -f out/arch/arm64/boot/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp out/arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
          elif [ -f arch/arm64/boot/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
          elif [ -f build/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp build/Image ../../kernel/dist/${short}/Image || true
          fi

          find out -name .config -type f -exec cp -v {} "${LOGDIR}/final.config" \; 2>/dev/null || true
          popd >/dev/null

          # package logs for upload
          tar -czf "/tmp/patch-results/${short}-logs.tar.gz" -C "/tmp/patch-results/${short}" . || true

      - name: Upload logs & image — 678
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-road-logs-678
          path: /tmp/patch-results/678
          if-no-files-found: warn

      - name: Upload image — 678
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-kernel-678
          path: kernel/dist/678
          if-no-files-found: warn
          retention-days: 7

      ####################################################################
      # Pattern 345
      ####################################################################
      - name: Pattern 345 — apply patch & run build_6.1.sh
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          short="345"
          label="3_4_5"
          LOGDIR="/tmp/patch-results/${short}"
          rm -rf "${LOGDIR}" || true
          mkdir -p "${LOGDIR}"
          workdir="aosp-patch-${label}"
          rm -rf "${workdir}" || true
          cp -a aosp-base "${workdir}"

          PATCH="${PATCH_BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_${label}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
          else
            pushd "${workdir}" >/dev/null || exit 1
            if git apply --reverse --check "$PATCH" 2>/dev/null; then
              echo "already-applied" > "${LOGDIR}/apply-status-${short}.txt"
            elif git apply --check "$PATCH" 2>/dev/null && git apply "$PATCH"; then
              echo "applied-clean" > "${LOGDIR}/apply-status-${short}.txt"
              git diff --name-only > "${LOGDIR}/applied-files-${short}.txt" || true
            else
              echo "apply-failed" > "${LOGDIR}/apply-status-${short}.txt"
              git apply --reject --whitespace=fix "$PATCH" 2> "${LOGDIR}/apply-stderr-${short}.txt" || true
              find . -name '*.rej' -print -exec cp --parents {} "${LOGDIR}/" \; || true
            fi
            cp -v "$PATCH" "${LOGDIR}/" 2>/dev/null || true
            popd >/dev/null
          fi

          cp build_6.1.sh "${workdir}/build_6.1.sh"
          chmod +x "${workdir}/build_6.1.sh"
          sed -i 's/^[[:space:]]*install_deps[[:space:]]*$/# install_deps disabled in CI: packages preinstalled/' "${workdir}/build_6.1.sh" || true
          sed -i 's/^MENUCONFIG=.*/MENUCONFIG=0/' "${workdir}/build_6.1.sh" || true
          sed -n '1,140p' "${workdir}/build_6.1.sh" > "${LOGDIR}/build_6.1-modified-head-${short}.txt" || true

          if [ -f "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" ]; then
            mkdir -p "${workdir}/arch/arm64/configs"
            cp "${GITHUB_WORKSPACE}/${EXTRA_CONFIG_PATH}" "${workdir}/arch/arm64/configs/extra-frag.config"
            sed -i 's/^EXTRA_CONFIGS=.*/EXTRA_CONFIGS=(\"extra-frag.config\")/' "${workdir}/build_6.1.sh" || true
            echo "copied fragment to arch/arm64/configs/extra-frag.config" > "${LOGDIR}/extra_config_injected-${short}.txt"
          else
            echo "extra_config_not_found:${EXTRA_CONFIG_PATH}" > "${LOGDIR}/extra_config_injected-${short}.txt"
          fi

          pushd "${workdir}" >/dev/null || exit 1
          echo "Starting build for pattern ${label} -> ${short}" > "${LOGDIR}/build-run-${short}.txt"
          if ./build_6.1.sh 2>&1 | tee "${LOGDIR}/build-output-${short}.log"; then
            echo "build-succeeded" > "${LOGDIR}/build-status-${short}.txt"
          else
            echo "build-failed" > "${LOGDIR}/build-status-${short}.txt"
          fi
          ls -la > "${LOGDIR}/workdir-listing-${short}.txt" || true

          if [ -f out/arch/arm64/boot/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp out/arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
          elif [ -f arch/arm64/boot/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp arch/arm64/boot/Image ../../kernel/dist/${short}/Image || true
          elif [ -f build/Image ]; then
            mkdir -p ../../kernel/dist/${short}
            cp build/Image ../../kernel/dist/${short}/Image || true
          fi

          find out -name .config -type f -exec cp -v {} "${LOGDIR}/final.config" \; 2>/dev/null || true
          popd >/dev/null

          tar -czf "/tmp/patch-results/${short}-logs.tar.gz" -C "/tmp/patch-results/${short}" . || true

      - name: Upload logs & image — 345
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-road-logs-345
          path: /tmp/patch-results/345
          if-no-files-found: warn

      - name: Upload image — 345
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-kernel-345
          path: kernel/dist/345
          if-no-files-found: warn
          retention-days: 7

      ####################################################################
      # Pattern 123
      ####################################################################
      - name: Pattern 123 — apply patch & run build_6.1.sh
        working-directory: kernel
        continue-on-error: true
        run: |
          set -euo pipefail
          short="123"
          label="1_2_3"
          LOGDIR="/tmp/patch-results/${short}"
          rm -rf "${LOGDIR}" || true
          mkdir -p "${LOGDIR}"
          workdir="aosp-patch-${label}"
          rm -rf "${workdir}" || true
          cp -a aosp-base "${workdir}"

          PATCH="${PATCH_BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_${label}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "missing-patch: $PATCH" > "${LOGDIR}/apply-status-${short}.txt"
          else
            pushd "${workdir}" >/dev/null || exit 1
            if git apply --reverse --check "$PATCH" 2>/dev/null; then
              echo "already-applied" > "${LOGDIR}/apply-status-${short}.txt"
            elif git apply --check "$PATCH" 2>/dev/null && git apply "$PATCH"; then
