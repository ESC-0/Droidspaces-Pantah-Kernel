name: Build Pixel 7 kernel with Droidspaces support

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python-is-python3 \
            build-essential bc bison flex patch pkg-config \
            tar xz-utils zip unzip cpio rsync kmod perl \
            libssl-dev libelf-dev pahole libncurses-dev \
            zlib1g-dev libyaml-dev lz4 zstd \
            device-tree-compiler adb fastboot

      - name: Install repo
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -Lf \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download official Pixel 7 kernel source
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16 \
            --depth=1

          repo sync \
            -c \
            --force-sync \
            --no-tags \
            -j2

          test -f aosp/Makefile
          test -f aosp/arch/arm64/configs/gki_defconfig

      - name: Download Droidspaces source
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            "$GITHUB_WORKSPACE/droidspaces"

      - name: Apply Pixel 7 Droidspaces patch
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          PATCH_DIR="$GITHUB_WORKSPACE/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"

          PATCH_FILE="$PATCH_DIR/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "Required Pixel 7 patch was not found:"
            echo "$PATCH_FILE"
            echo
            find "$PATCH_DIR" -maxdepth 1 -type f -print | sort
            exit 1
          fi

          echo "Checking patch:"
          echo "$PATCH_FILE"

          if git apply --reverse --check --whitespace=nowarn "$PATCH_FILE"; then
            echo "The patch is already applied."
          elif git apply --check --whitespace=nowarn "$PATCH_FILE"; then
            git apply --whitespace=nowarn "$PATCH_FILE"
            echo "The 6_7_8 patch was applied successfully."
          else
            echo "The 6_7_8 patch does not apply to this kernel source."
            git status --short
            exit 1
          fi

          git diff --check
          git diff -- include/linux/sched.h

      - name: Create Droidspaces configuration fragment
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          cat > droidspaces.config <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_OVERLAY_FS=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          EOF

          cat droidspaces.config

      - name: Merge Droidspaces configuration into GKI defconfig
        working-directory: kernel/aosp
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"

          cp "$CONFIG" "$CONFIG.before-droidspaces"

          while IFS= read -r setting; do
            option="${setting%%=*}"
            value="${setting#*=}"

            sed -i \
              -e "/^${option}=.*$/d" \
              -e "/^# ${option} is not set$/d" \
              "$CONFIG"

            printf '%s\n' "${option}=${value}" >> "$CONFIG"
          done < droidspaces.config

          for option in \
            CONFIG_SYSVIPC \
            CONFIG_POSIX_MQUEUE \
            CONFIG_NAMESPACES \
            CONFIG_IPC_NS \
            CONFIG_PID_NS \
            CONFIG_NET_NS \
            CONFIG_CGROUPS \
            CONFIG_CGROUP_PIDS \
            CONFIG_CGROUP_DEVICE \
            CONFIG_CGROUP_FREEZER \
            CONFIG_CGROUP_SCHED \
            CONFIG_CPUSETS \
            CONFIG_MEMCG \
            CONFIG_USER_NS \
            CONFIG_SECCOMP \
            CONFIG_SECCOMP_FILTER \
            CONFIG_DEVTMPFS \
            CONFIG_DEVTMPFS_MOUNT \
            CONFIG_TMPFS \
            CONFIG_TMPFS_POSIX_ACL \
            CONFIG_TMPFS_XATTR \
            CONFIG_OVERLAY_FS \
            CONFIG_NETFILTER \
            CONFIG_NETFILTER_XT_TARGET_REJECT \
            CONFIG_NETFILTER_XT_TARGET_LOG \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            CONFIG_NETFILTER_XT_MATCH_RECENT \
            CONFIG_NETFILTER_XT_SET \
            CONFIG_IP_SET \
            CONFIG_IP_SET_HASH_IP \
            CONFIG_IP_SET_HASH_NET; do

            if ! grep -q "^${option}=y$" "$CONFIG"; then
              echo "ERROR: ${option} was not enabled"
              exit 1
            fi
          done

          git diff --check
          git diff -- "$CONFIG"

      - name: Build Pixel 7 kernel
        working-directory: kernel
        run: |
          set -euo pipefail

          rm -rf out bazel-bin bazel-out bazel-testlogs dist
          mkdir -p dist

          tools/bazel build \
            --config=local \
            --spawn_strategy=local \
            --strategy=KernelBuild=local \
            --disk_cache= \
            --repository_cache= \
            //common:kernel_aarch64

          tools/bazel build \
            --config=local \
            --spawn_strategy=local \
            --strategy=KernelBuild=local \
            --disk_cache= \
            --repository_cache= \
            //common:kernel_aarch64_images

      - name: Collect kernel outputs
        working-directory: kernel
        run: |
          set -euo pipefail

          find bazel-bin out \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.lz4' \
              -o -name 'Image.gz' \
              -o -name 'Image.gz-dtb' \
              -o -name '*.dtb' \
              -o -name '*.dtbo' \
              -o -name '*.img' \
              -o -name 'boot.img' \
              -o -name 'vendor_boot.img' \
            \) \
            -exec cp -v {} dist/ \; || true

          CONFIG="$(find out -name .config -type f -print -quit)"
          test -n "$CONFIG"

          cp "$CONFIG" dist/final.config
          cp aosp/arch/arm64/configs/gki_defconfig \
            dist/gki_defconfig

          grep -E \
            '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_NAMESPACES|CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_NET_NS|CONFIG_CGROUPS|CONFIG_USER_NS|CONFIG_SECCOMP|CONFIG_DEVTMPFS|CONFIG_DEVTMPFS_MOUNT|CONFIG_OVERLAY_FS)=' \
            "$CONFIG" | sort

          test -n "$(find dist -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.lz4' \
              -o -name 'Image.gz' \
              -o -name 'Image.gz-dtb' \
            \) \
            -print -quit)"

          find dist -type f -print | sort

      - name: Upload compiled kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-pantah-droidspaces-kernel
          path: kernel/dist/
          if-no-files-found: error
          retention-days: 7
